name: Diagnóstico fiscal SICONFI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_fiscal.py'
      - '.github/workflows/probe-fiscal.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Testar dados fiscais de Guariba no Tesouro
        run: python3 scripts/probe_fiscal.py
